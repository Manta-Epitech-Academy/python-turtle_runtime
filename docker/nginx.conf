server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative: behind TLS-terminating ingress, nginx sees http.
    absolute_redirect off;

    # The platform shows this app in a same-origin iframe: SAMEORIGIN, not DENY.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Standalone convenience (docker run): land on the app.
    location = / {
        return 302 /runtime/python-turtle/latest/;
    }

    # The app is served under /runtime/python-turtle/latest/, the path the
    # workshop platform embeds it at (/runtime/<id>/<version>/, same origin as
    # CTFd). Every URL in index.html is relative, so it works at any prefix; the
    # files simply live at that path under the document root. A missing asset
    # is a 404, never index.html.
    # Exact match, so the bare path is not read as a version by the regex below
    # (which would redirect it to itself).
    location = /runtime/python-turtle/latest {
        return 301 /runtime/python-turtle/latest/;
    }

    # The URL says "latest", so it cannot promise unchanging content. Cache
    # policy by kind of file; every nested location restates the frame headers
    # because an add_header in a location replaces the inherited set.
    #
    # `^~` so the version-redirect regex below is not consulted for this prefix.
    location ^~ /runtime/python-turtle/latest/ {
        # Default, for app.js and style.css (no hash in their names): always
        # revalidate, 304 on the ETag.
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;

        # The entry page: never stored.
        location = /runtime/python-turtle/latest/index.html {
            add_header Cache-Control "no-store" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Skulpt is fetched at a pinned version: cache hard.
        location /runtime/python-turtle/latest/vendor/ {
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    # Any other version of this runtime (a subject still pinning a commit sha)
    # goes to the one build this image carries.
    location ~ ^/runtime/python-turtle/[^/]+(/.*)?$ {
        return 302 /runtime/python-turtle/latest$1$is_args$args;
    }
}
