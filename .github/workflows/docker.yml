name: Publish container image (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rolls this runtime so it picks up the image the build just pushed. One
  # Deployment serves every CTFd instance, so there is exactly one to restart
  # and no list to keep here.
  #
  # `needs: build-and-push` is what makes it conditional on a successful build,
  # and the `if` keeps it to main: this workflow also fires on tags and on pull
  # requests, which publish nothing the cluster should take.
  #
  # The Deployment pulls on every start (imagePullPolicy: Always in jumper-k3s),
  # so a restart is the whole operation.
  restart-k3s:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<KUBECONFIG
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: ${{ secrets.K3S_URL }}
                insecure-skip-tls-verify: true
              name: k3s
          contexts:
            - context:
                cluster: k3s
                user: k3s-user
              name: k3s
          current-context: k3s
          users:
            - name: k3s-user
              user:
                token: ${{ secrets.K3S_TOKEN }}
          KUBECONFIG
          chmod 600 ~/.kube/config

      - name: Restart the python-turtle runtime
        run: |
          set -euo pipefail
          kubectl rollout restart deploy/python-turtle-runtime -n ctfd-runtimes
          kubectl rollout status deploy/python-turtle-runtime -n ctfd-runtimes --timeout=300s

  # The dist in the runtimes bucket, which the workshop platform's proxy serves
  # at /runtime/python-turtle/<version>/ (ctfd-workshop-platform docs/DEPLOY.md,
  # "Runtimes in the bucket"). Two prefixes: the short sha subjects pin,
  # immutable, and `latest`, the build of main. Independent of the image job:
  # the image is for the cluster's Services, the bucket is for the proxy, and
  # the second does not wait for the first. Skips with a notice until the
  # RUNTIMES_S3_* variables and secrets exist on the organisation.
  bucket:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # No bundler: the repo is the site, URLs are relative. Fetch Skulpt and
      # Monaco the way the image does, then keep only what the page loads
      # (the same list the Dockerfile removes).
      - run: sh scripts/vendor.sh
      - run: |
          rsync -a --exclude-from=- ./ dist/ <<'EXCLUDE'
          .git
          .github
          scripts
          README.md
          Dockerfile
          .dockerignore
          docker
          dist
          EXCLUDE
      - name: Upload to the runtimes bucket
        uses: Manta-Epitech-Academy/ctfd-workshop-platform/.github/actions/upload-runtime@main
        with:
          runtime-id: python-turtle
          version: ${{ steps.sha.outputs.short }}
          dist: dist
          latest-dist: dist
          endpoint: ${{ vars.RUNTIMES_S3_ENDPOINT }}
          bucket: ${{ vars.RUNTIMES_S3_BUCKET }}
          region: ${{ vars.RUNTIMES_S3_REGION }}
          access-key-id: ${{ secrets.RUNTIMES_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.RUNTIMES_S3_SECRET_ACCESS_KEY }}
